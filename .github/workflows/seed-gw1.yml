name: Seed GW1

# Manual only. Click "Run workflow" in the Actions tab.
# Nothing about this runs on a schedule — it exists to write the one gameweek
# whose projections predate the snapshot layer.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Continue even if the poster and FPL disagree on the squad'
        type: boolean
        default: false

jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # lets the built-in token commit; no PAT needed

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install --quiet requests

      - name: Build the GW1 record
        run: python seed_gw1.py ${{ inputs.force && '--yes' || '' }}

      - name: Show what it produced
        run: |
          echo "--- data/season.json ---"
          python -m json.tool data/season.json | head -60
          echo "--- projections ---"
          python -m json.tool data/projections/gw1.json | head -20

      - name: Commit
        run: |
          git config user.name  "fpl-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "GW1: projections from the poster, plus results"
            git push
          fi
