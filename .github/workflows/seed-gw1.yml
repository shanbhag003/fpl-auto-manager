name: Seed GW1

# Manual only. Actions tab -> Seed GW1 -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Continue even if the poster and FPL disagree on the squad'
        type: boolean
        default: false

jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the built-in token commits; no PAT needed

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Find the script
        run: |
          echo "--- repository root ---"
          ls -la
          if [ ! -f seed_gw1.py ]; then
            echo ""
            echo "seed_gw1.py is not in the repository root. Found instead:"
            find . -name 'seed_gw1.py' -not -path './.git/*' || echo "  (nowhere in the repo)"
            echo ""
            echo "Move it to the root, or upload it there, and re-run."
            exit 1
          fi
          echo "OK: seed_gw1.py found"

      - name: Install requests
        run: pip install --quiet requests

      - name: Build the GW1 record
        env:
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=""
          if [ "$FORCE" = "true" ]; then ARGS="--yes"; fi
          echo "Running: python seed_gw1.py $ARGS"
          python seed_gw1.py $ARGS

      - name: Show what it produced
        run: |
          echo "--- data/season.json ---"
          python -m json.tool data/season.json | head -80
          echo ""
          echo "--- data/projections/gw1.json ---"
          python -m json.tool data/projections/gw1.json | head -25

      - name: Commit
        run: |
          git config user.name  "fpl-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "GW1: projections from the poster, plus results"
            git push
          fi
