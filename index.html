<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autonomous FPL System</title>
<meta name="description" content="An FPL bot that picks its own team, publishes its projection before kickoff, and gets marked against a human.">
<meta name="theme-color" content="#17021D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#17021D; --mid:#3A0A46; --glow:#5C0F6C;
  --mint:#00FF87; --amber:#FFC24D; --rose:#FF5D7A;
  --lav:#C7B3CF; --lavd:#9A85A4; --white:#fff;
  --card:rgba(255,255,255,.055);
  --card-hi:rgba(255,255,255,.10);
  --line:rgba(255,255,255,.13);
  --rail:248px;
  --display:'Space Grotesk',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  /* type scale: body copy grows a little on wider screens; labels stay fixed */
  --t-3xs:8px; --t-2xs:10px; --t-xs:11px; --t-sm:12px;
  --t-base:clamp(13px,.76rem + .2vw,14px);
  --t-md:clamp(14px,.82rem + .3vw,15.5px);
  --t-lg:clamp(16px,.92rem + .35vw,17.5px);
  --t-xl:clamp(18px,1rem + .45vw,20px);
  --t-2xl:clamp(21px,1.1rem + .7vw,24px);
  /* spacing scale: --sN is N x 4px */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:28px;
  --s8:32px; --s9:36px; --s10:40px; --s12:48px; --s14:56px; --s18:72px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%; background:var(--deep);
  -webkit-tap-highlight-color:transparent;   /* no blue flash on tap */
  overscroll-behavior-y:none;                 /* no rubber-band past the gradient */
  overflow-x:clip}                            /* wide content scrolls in its own box */
body{
  font-family:var(--body); color:var(--white); background:var(--deep);
  min-height:100vh; min-height:100dvh;     /* dvh: mobile browser chrome doesn't clip */
  -webkit-font-smoothing:antialiased; line-height:1.5; overscroll-behavior-y:none;
}
body::before{
  content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(120% 80% at 12% 0%, var(--glow) 0%, transparent 55%),
    radial-gradient(90% 70% at 100% 12%, var(--mid) 0%, transparent 60%),
    radial-gradient(80% 60% at 60% 100%, #2A0733 0%, transparent 65%),
    var(--deep);
}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

.eyebrow{
  font-family:var(--mono); font-size:var(--t-xs); font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; color:var(--mint);
}
.eyebrow.dim{color:var(--lavd)}

/* ---------- shell ---------- */
.shell{display:flex; min-height:100vh; min-height:100dvh; max-width:1320px; margin:0 auto}

.rail{
  width:var(--rail); flex:0 0 var(--rail);
  padding:max(var(--s7),env(safe-area-inset-top)) var(--s4)
          calc(var(--s10) + env(safe-area-inset-bottom)) max(var(--s4),env(safe-area-inset-left));
  border-right:1px solid var(--line); position:sticky; top:0;
  height:100vh; height:100dvh; overflow-y:auto; overscroll-behavior:contain;
}
.rail h1{font-family:var(--display);font-size:var(--t-xl);font-weight:700;letter-spacing:-.01em;margin:var(--s2) 0 2px}
.rail .sub{font-size:var(--t-sm);color:var(--lavd);margin-bottom:var(--s6)}

.tally{display:grid;gap:var(--s2);margin-bottom:var(--s6)}
.tally-row{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:var(--s2) var(--s3);border-radius:10px;background:var(--card);border:1px solid var(--line);
}
.tally-row .who{font-family:var(--mono);font-size:var(--t-2xs);letter-spacing:.12em;text-transform:uppercase;color:var(--lavd)}
.tally-row .pts{font-family:var(--display);font-size:var(--t-xl);font-weight:700}
.tally-row.lead{border-color:rgba(0,255,135,.35);background:rgba(0,255,135,.07)}
.tally-row.lead .pts{color:var(--mint)}

.gwlist{display:grid;gap:4px}
.gwbtn{
  display:flex;align-items:center;gap:var(--s2);width:100%;
  padding:var(--s2) var(--s3);border-radius:9px;border:1px solid transparent;
  text-align:left;transition:background .15s,border-color .15s;
}
@media(hover:hover){.gwbtn:hover{background:var(--card)}}
.gwbtn[aria-current="true"]{background:var(--card-hi);border-color:var(--line)}
.gwbtn .n{font-family:var(--mono);font-size:var(--t-sm);color:var(--lavd);min-width:34px}
.gwbtn[aria-current="true"] .n{color:var(--mint)}
.gwbtn .r{margin-left:auto;font-family:var(--mono);font-size:var(--t-sm);color:var(--lav)}
.gwbtn .r b{font-weight:600;color:var(--white)}
.gwbtn .r .pend{color:var(--lavd)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--amber);flex:0 0 6px;
  animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- main ---------- */
.main{flex:1;min-width:0;
  padding:max(var(--s8),env(safe-area-inset-top)) max(var(--s7),env(safe-area-inset-right))
          calc(var(--s18) + env(safe-area-inset-bottom)) var(--s7)}
.mobilebar{display:none}

.head{margin-bottom:var(--s6)}
.head h2{font-family:var(--display);font-size:clamp(34px,7vw,56px);font-weight:700;letter-spacing:-.025em;line-height:1.02;margin:6px 0 var(--s2)}
.head p{color:var(--lav);font-size:var(--t-md);max-width:62ch}

.clock{display:flex;flex-direction:column;gap:5px;margin-top:var(--s4);
  padding:var(--s3) var(--s4);border-radius:11px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);align-self:flex-start;max-width:100%}
.ct{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;
  font-family:var(--mono);font-size:var(--t-xs);letter-spacing:.02em;color:var(--lav)}
.ct .k{font-size:var(--t-2xs);font-weight:600;letter-spacing:.15em;text-transform:uppercase;
  color:var(--lavd);min-width:82px}
.ct b{font-weight:600;color:var(--white)}
.ct.dim b{color:var(--lav);font-weight:400}
.tz{font-family:var(--mono);font-size:var(--t-2xs);font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;padding:3px var(--s2);border-radius:999px;
  border:1px solid var(--line);color:var(--lavd);
  transition:border-color .15s,color .15s,background .15s}
@media(hover:hover){.tz:hover{border-color:rgba(0,255,135,.45);color:var(--mint);background:rgba(0,255,135,.07)}}
.tz{position:relative}
.flags{display:flex;flex-wrap:wrap;gap:7px;margin-top:var(--s4)}
.flag{
  font-family:var(--mono);font-size:var(--t-2xs);letter-spacing:.1em;text-transform:uppercase;
  padding:4px var(--s2);border-radius:999px;border:1px solid var(--line);color:var(--lavd);
}
.flag.live{border-color:rgba(255,194,77,.4);color:var(--amber)}
.flag.ok{border-color:rgba(0,255,135,.35);color:var(--mint)}

/* verdict */
.verdict{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:14px;
  overflow:hidden;margin-bottom:var(--s6);
}
.vcell{background:rgba(23,2,29,.72);padding:var(--s4) var(--s4)}
.vcell .lbl{font-family:var(--mono);font-size:var(--t-2xs);letter-spacing:.12em;text-transform:uppercase;color:var(--lavd);margin-bottom:7px}
.vcell .big{font-family:var(--display);font-size:clamp(28px,5vw,38px);font-weight:700;line-height:1;letter-spacing:-.02em}
.vcell .note{font-size:var(--t-sm);color:var(--lavd);margin-top:6px}
.vcell.bot .big{color:var(--mint)}
.vcell.human .big{color:var(--white)}
.vcell.proj .big{color:var(--lav)}
.delta{font-family:var(--mono);font-size:var(--t-sm);font-weight:600}
.up{color:var(--mint)} .down{color:var(--rose)} .flat{color:var(--lavd)}

/* pitch */
.pitch{
  position:relative;border:1px solid var(--line);border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.008));
  padding:var(--s6) var(--s3) var(--s5);margin-bottom:var(--s4);overflow:hidden;
}
.pitch::before{
  content:'';position:absolute;left:50%;top:-14%;transform:translateX(-50%);
  width:64%;height:128%;border:1px solid rgba(255,255,255,.05);border-radius:50%/12%;
  pointer-events:none;
}
.line{margin-bottom:var(--s4)}
.line:last-child{margin-bottom:0}
.line-label{display:none}
.row{display:flex;justify-content:center;flex-wrap:wrap;gap:var(--s2)}

.pcard{
  position:relative;width:112px;padding:var(--s2) var(--s2) 7px;border-radius:12px;
  background:var(--card);border:1px solid var(--line);text-align:center;
}
.pcard.capt{border-color:rgba(0,255,135,.55);background:rgba(0,255,135,.08)}
.pcard.vice{border-color:rgba(255,194,77,.5);background:rgba(255,194,77,.07)}
.pcard .nm{font-family:var(--display);font-size:var(--t-base);font-weight:700;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .tm{font-family:var(--mono);font-size:var(--t-3xs);letter-spacing:.11em;color:var(--lavd);margin:1px 0 5px}
.scores{display:flex;align-items:baseline;justify-content:center;gap:7px}
.scores .pj{font-family:var(--mono);font-size:var(--t-sm);color:var(--lavd)}
.scores .ac{font-family:var(--display);font-size:var(--t-xl);font-weight:700;line-height:1}
.scores.pending .pj{font-family:var(--display);font-size:var(--t-xl);font-weight:700;color:var(--mint)}

/* points bar: length is points scored, the tick is where the model predicted */
.pbar{position:relative;height:4px;margin-top:var(--s2);border-radius:2px;background:rgba(255,255,255,.09)}
.pbar i{position:absolute;left:0;top:0;height:4px;border-radius:2px;display:block;min-width:2px}
.pbar .tick{position:absolute;top:-3px;width:1.5px;height:10px;border-radius:1px;
  background:var(--lav);opacity:.85;transform:translateX(-.75px)}
.pcard.toplay{border-style:dashed;opacity:.85}
.pcard.toplay .scores .pj{color:var(--lav)}

.badges{
  position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  display:flex;gap:3px;white-space:nowrap;
}
.badge{
  font-family:var(--mono);font-size:var(--t-3xs);font-weight:600;letter-spacing:.1em;
  padding:2px 7px;border-radius:999px;background:var(--mint);color:#04120A;white-space:nowrap;
}
.badge.v{background:var(--amber);color:#1A1200}
.badge.on{background:rgba(0,255,135,.18);color:var(--mint);border:1px solid rgba(0,255,135,.45)}
.badge.off{background:rgba(255,93,122,.15);color:var(--rose);border:1px solid rgba(255,93,122,.4)}
.badges .badge{padding:2px 6px}
.badges .badge+.badge{padding:2px 5px}

.tolabel{font-family:var(--mono);font-size:var(--t-3xs);letter-spacing:.12em;
  text-transform:uppercase;color:var(--lavd);margin-top:var(--s2)}
.benchwrap{text-align:center;margin-bottom:var(--s8)}
.benchwrap .eyebrow{display:block;margin-bottom:var(--s3)}
.bench{display:flex;justify-content:center;flex-wrap:wrap;gap:var(--s2)}
.bench .pcard{width:100px;opacity:.72}
.bench .pcard.used{opacity:1}

/* how-to-read panel */
.guide{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.028);
  margin-bottom:var(--s6);overflow:hidden}
.guide summary{list-style:none;cursor:pointer;padding:var(--s4) var(--s4);display:flex;
  align-items:center;gap:var(--s2);font-family:var(--mono);font-size:var(--t-2xs);font-weight:600;
  letter-spacing:.15em;text-transform:uppercase;color:var(--lavd);
  transition:color .15s}
.guide summary::-webkit-details-marker{display:none}
@media(hover:hover){.guide summary:hover{color:var(--lav)}}
.guide summary{min-height:44px}
.guide summary .chev{margin-left:auto;transition:transform .2s;font-size:var(--t-base)}
.guide[open] summary .chev{transform:rotate(180deg)}
.guide[open] summary{color:var(--mint);border-bottom:1px solid var(--line)}
.gbody{padding:var(--s5) var(--s4) var(--s4);display:flex;gap:var(--s6);align-items:flex-start}
.gdemo{display:flex;gap:var(--s2);flex:0 0 auto}
.gdemo .pcard{width:118px}
.gintro{font-size:var(--t-base);color:var(--lav);line-height:1.6;margin-bottom:var(--s4);max-width:66ch}
.gintro b{color:var(--white);font-weight:600}
.gkey{display:grid;gap:var(--s3);min-width:0}
.gkey div{display:grid;grid-template-columns:auto 1fr;gap:var(--s3);align-items:baseline;
  font-size:var(--t-base);color:var(--lav);line-height:1.5}
.gkey .t{font-family:var(--mono);font-size:var(--t-xs);font-weight:600;color:var(--white);
  white-space:nowrap;padding-top:1px}
.gkey .sw{display:inline-block;width:26px;height:4px;border-radius:2px;vertical-align:middle}

/* sections */
.sec{margin-bottom:var(--s8)}
.sec > .eyebrow{display:block;margin-bottom:var(--s3)}

.tf{
  display:grid;grid-template-columns:1fr auto;gap:6px var(--s4);align-items:start;
  padding:var(--s4) var(--s4);border:1px solid var(--line);border-radius:12px;
  background:var(--card);margin-bottom:var(--s2);
}
.tf .swap{font-family:var(--display);font-size:var(--t-lg);font-weight:700;letter-spacing:-.01em}
.tf .swap .arrow{color:var(--lavd);margin:0 var(--s2);font-weight:500}
.tf .swap .out{color:var(--lavd);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.3)}
.tf .swap .in{color:var(--mint)}
.tf .why{grid-column:1/-1;font-size:var(--t-base);color:var(--lav);line-height:1.55}
.tf .meta{font-family:var(--mono);font-size:var(--t-xs);text-align:right;color:var(--lavd);white-space:nowrap}
.tf .meta b{display:block;font-size:var(--t-base);color:var(--mint);font-weight:600}
.tf .meta.hit b{color:var(--amber)}

.plain{
  padding:var(--s4) var(--s4);border:1px dashed var(--line);border-radius:12px;
  background:rgba(255,255,255,.02);font-size:var(--t-base);color:var(--lav);
}
.plain b{color:var(--white);font-weight:600}

.newsitem{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);
  border:1px solid var(--line);border-radius:11px;background:var(--card);margin-bottom:var(--s2)}
.newsitem .risk{font-family:var(--mono);font-size:var(--t-sm);font-weight:600;color:var(--amber);
  min-width:42px;padding-top:1px}
.newsitem .txt{font-size:var(--t-base);color:var(--lav)}
.newsitem .txt b{color:var(--white);font-weight:600}

.chartwrap{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:var(--s4) var(--s4) var(--s3)}
.legend{display:flex;gap:var(--s4);margin-bottom:var(--s3);font-family:var(--mono);font-size:var(--t-2xs);letter-spacing:.08em;text-transform:uppercase}
.legend span{display:flex;align-items:center;gap:6px;color:var(--lavd)}
.legend i{width:14px;height:2px;border-radius:2px}
svg{display:block;width:100%;height:auto;overflow:visible}

.foot{border-top:1px solid var(--line);padding-top:var(--s4);display:flex;
  justify-content:space-between;gap:var(--s4);flex-wrap:wrap}
.foot .eyebrow{font-size:var(--t-2xs)}

/* ---------- tabs: the bot's season, or your own team ---------- */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:var(--s1);padding:var(--s1);
  border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:var(--s6)}
.tabs[hidden]{display:none}
.tab{min-height:40px;border-radius:9px;font-family:var(--mono);font-size:var(--t-2xs);
  font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--lavd)}
.tab[aria-selected="true"]{background:var(--mint);color:#04120A}
.tab[data-tab="team"][aria-selected="true"]{background:var(--amber);color:#1A1200}
@media(hover:hover){.tab:not([aria-selected="true"]):hover{color:var(--white)}}
.mnav{display:none}

/* a one-line way into "Your team" from the bot's page */
.teamcta{display:inline-flex;align-items:center;gap:var(--s2);margin-top:var(--s4);
  min-height:44px;padding:0 var(--s4);border-radius:999px;border:1px solid rgba(255,194,77,.4);
  color:var(--amber);font-size:var(--t-sm);font-weight:600;text-decoration:none}
@media(hover:hover){.teamcta:hover{background:rgba(255,194,77,.08)}}

/* ---------- your team (squad lookup) ---------- */
#team .head .eyebrow{color:var(--amber)}
.lform{display:flex;gap:var(--s2);flex-wrap:wrap;margin:var(--s4) 0 6px}
.lform input{flex:1 1 180px;min-width:0;min-height:44px;padding:0 var(--s4);border-radius:10px;
  border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--white);
  font-family:var(--mono);font-size:var(--t-lg);letter-spacing:.04em}
.lform input:focus{outline:none;border-color:rgba(255,194,77,.6)}
.lform button{min-height:44px;padding:0 var(--s4);border-radius:10px;font-weight:600;
  background:var(--amber);color:#1A1200}
.lform button:disabled{opacity:.55;cursor:default}
.lhint{font-size:var(--t-sm);color:var(--lavd)}
.lhint code{font-family:var(--mono);color:var(--lav)}
.lmsg{margin-top:var(--s4)}
.lmsg.err{border-color:rgba(255,93,122,.4);color:var(--rose)}
.lres{margin-top:var(--s4)}
.lres .head{margin-bottom:var(--s4)}
.lres .head h2{font-size:clamp(24px,5vw,34px)}
.lfacts{display:grid;gap:var(--s2);margin-bottom:var(--s4)}
.lfact{padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:11px;background:var(--card);
  font-size:var(--t-base);color:var(--lav)}
.lfact .k{display:block;font-family:var(--mono);font-size:var(--t-2xs);letter-spacing:.12em;
  text-transform:uppercase;color:var(--lavd);margin-bottom:4px}
.lfact b{color:var(--white);font-weight:600}
.lfact .good{color:var(--mint)} .lfact .warn{color:var(--amber)}
.ups{list-style:none;display:grid;gap:var(--s2);margin-top:var(--s1)}
.ups li{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s3);align-items:baseline;
  padding-top:var(--s2);border-top:1px solid var(--line)}
.ups li:first-child{border-top:none;padding-top:0}
.ups .rk{font-family:var(--mono);font-size:var(--t-2xs);color:var(--lavd);min-width:1ch}
.ups .sub{display:block;font-size:var(--t-sm);color:var(--lavd);margin-top:2px}
.ups .g{font-family:var(--mono);font-weight:600;color:var(--mint);white-space:nowrap}

.state{padding:var(--s18) var(--s5);text-align:center;color:var(--lav)}
.state h3{font-family:var(--display);font-size:var(--t-2xl);font-weight:700;color:var(--white);margin-bottom:var(--s2)}
.state code{font-family:var(--mono);font-size:var(--t-sm);background:var(--card);
  padding:3px 7px;border-radius:5px;border:1px solid var(--line)}

/* ---------- mobile ---------- */
@media(max-width:860px){
  .shell{display:block}
  .rail{display:none}
  .main{padding:calc(var(--s5) + env(safe-area-inset-top)) max(var(--s4),env(safe-area-inset-right))
          calc(var(--s14) + env(safe-area-inset-bottom)) max(var(--s4),env(safe-area-inset-left))}
  /* tabs and pills, pinned: full bleed, frosted, clear of the notch */
  .mnav{display:block;position:sticky;top:0;z-index:10;margin-bottom:var(--s5);
    margin-inline:calc(-1 * max(var(--s4),env(safe-area-inset-left))) calc(-1 * max(var(--s4),env(safe-area-inset-right)));
    padding:calc(var(--s2) + env(safe-area-inset-top)) max(var(--s4),env(safe-area-inset-right))
            var(--s2) max(var(--s4),env(safe-area-inset-left));
    background:rgba(23,2,29,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line)}
  .mnav .tabs{margin-bottom:var(--s2)}
  .mobilebar{margin-bottom:var(--s3)}
  body.team .strip{display:none}
  /* a landscape phone is ~340px tall: pinned, the bar would take a third of it */
  @media(max-height:500px){.mnav{position:static}}
  body.team .mnav .tabs{margin-bottom:0}
  /* the pill strip scrolls edge to edge, but its first and last pills stop
     clear of the notch and the rounded corners */
  .strip{margin-inline:calc(-1 * max(var(--s4),env(safe-area-inset-left))) calc(-1 * max(var(--s4),env(safe-area-inset-right)));
    padding-inline:max(var(--s4),env(safe-area-inset-left)) max(var(--s4),env(safe-area-inset-right));
    scroll-padding-inline:max(var(--s4),env(safe-area-inset-left))}
  .mobilebar{display:block;margin-bottom:var(--s5)}
  .mobilebar .top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4)}
  .mobilebar h1{font-family:var(--display);font-size:var(--t-md);font-weight:700}
  .mtally{display:flex;gap:var(--s2);margin-bottom:var(--s4)}
  .mtally .t{flex:1;padding:var(--s2) var(--s3);border-radius:10px;background:var(--card);border:1px solid var(--line)}
  .mtally .t.lead{border-color:rgba(0,255,135,.35);background:rgba(0,255,135,.07)}
  .mtally .who{font-family:var(--mono);font-size:var(--t-2xs);letter-spacing:.11em;text-transform:uppercase;color:var(--lavd)}
  .mtally .pts{font-family:var(--display);font-size:var(--t-xl);font-weight:700}
  .mtally .t.lead .pts{color:var(--mint)}
  .strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:5px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .strip::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:7px var(--s3);border-radius:999px;border:1px solid var(--line);
    background:var(--card);font-family:var(--mono);font-size:var(--t-xs);letter-spacing:.06em;color:var(--lav);white-space:nowrap}
  .chip[aria-current="true"]{background:var(--mint);border-color:var(--mint);color:#04120A;font-weight:600}

  .clock{width:100%;padding:var(--s2) var(--s3)}
  .ct{font-size:var(--t-2xs);gap:7px}
  .ct .k{min-width:0;flex:0 0 100%;margin-bottom:1px}
  .gbody{flex-direction:column;gap:var(--s4);padding:var(--s4) var(--s4)}
  .gdemo{align-self:center}
  .gkey div{grid-template-columns:1fr;gap:2px}
  .gkey .t{padding-top:0}
  .verdict{grid-template-columns:1fr;gap:1px}
  .vcell{display:flex;align-items:baseline;justify-content:space-between;padding:var(--s4) var(--s4)}
  .vcell .lbl{margin-bottom:0}
  .vcell .note{margin-top:0}
  .pitch{padding:var(--s3) var(--s2) var(--s4);background:none;border:none}
  .pitch::before{display:none}          /* the centre circle reads as clutter here */
  .line{margin-bottom:var(--s3);padding:var(--s3) var(--s2) var(--s3);border-radius:13px;
    background:rgba(255,255,255,.026);border:1px solid rgba(255,255,255,.075)}
  .line-label{display:flex;align-items:center;gap:var(--s2);margin:0 4px var(--s3);
    font-family:var(--mono);font-size:var(--t-2xs);font-weight:600;letter-spacing:.17em;
    text-transform:uppercase;color:var(--lavd)}
  .line-label::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.11)}
  .line-label b{font-weight:600;color:var(--lav)}
  .line-gk .line-label{color:var(--amber)}
  .line-def .line-label,.line-mid .line-label,.line-fwd .line-label{color:var(--lavd)}
  .row{gap:6px}
  .pcard{width:calc(33.333% - 5px);max-width:112px;padding:var(--s2) 5px 6px}
  .pcard .nm{font-size:var(--t-sm)}
  .scores .ac{font-size:var(--t-lg)}
  .scores.pending .pj{font-size:var(--t-lg)}
  .benchwrap{padding:var(--s3) var(--s2) var(--s3);border-radius:13px;
    background:rgba(255,255,255,.018);border:1px dashed rgba(255,255,255,.09)}
  .benchwrap .eyebrow{margin-bottom:var(--s3)}
  .bench{gap:6px}
  .bench .pcard{width:calc(25% - 5px);padding:var(--s2) 4px 6px}
  .bench .pcard .nm{font-size:var(--t-2xs)}
  .bench .pcard .tm{font-size:var(--t-3xs)}
  .tf{grid-template-columns:1fr}
  .tf .meta{text-align:left}
  .tf .swap{font-size:var(--t-md)}
}
/* touch: every control at least 44x44 of hit area, without changing its look */
@media(pointer:coarse){
  .chip{min-height:44px;display:inline-flex;align-items:center}
  .gwbtn{min-height:44px}
  .tab{min-height:44px}
  .tz::after{content:'';position:absolute;inset:-13px -8px}   /* invisible, enlarges the target */
  .guide summary{min-height:48px}
}
.chip,.gwbtn,.tz,.lform button{transition:transform .12s ease-out,background .15s,border-color .15s,color .15s}
.chip:active,.gwbtn:active,.tz:active,.lform button:active{transform:scale(.96)}

/* gameweek switch: a short, interruptible fade-up (a new switch restarts it) */
#view.enter{animation:viewIn .32s cubic-bezier(.2,.7,.2,1)}
/* starts at .25, not 0: if a browser ever freezes the animation, the page is still readable */
@keyframes viewIn{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}

/* loading: the page's own shapes, shimmering, rather than plain text */
.skel{padding:var(--s2) 0}
.sk{border-radius:10px;background:linear-gradient(90deg,var(--card) 0%,var(--card-hi) 45%,var(--card) 90%);
  background-size:220% 100%;animation:shimmer 1.4s ease-in-out infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-100% 0}}
.sk-title{height:clamp(38px,7vw,56px);width:min(380px,70%);margin:var(--s3) 0 var(--s4)}
.sk-line{height:14px;width:min(520px,90%);margin-bottom:var(--s6)}
.sk-block{height:76px;margin-bottom:var(--s6);border-radius:14px}
.sk-row{display:flex;justify-content:center;flex-wrap:wrap;gap:var(--s2);margin-bottom:var(--s3)}
.sk-card{width:112px;height:68px;border-radius:12px}
@media(max-width:860px){.sk-card{width:calc(33.333% - 6px);max-width:112px}}
.lmsg.loading{display:flex;align-items:center;gap:var(--s2)}
.lmsg.loading::before{content:'';width:7px;height:7px;border-radius:50%;flex:0 0 7px;
  background:var(--amber);animation:pulse 1.2s ease-in-out infinite}

@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
}
:focus-visible{outline:2px solid var(--mint);outline-offset:3px;border-radius:6px}
</style>
</head>
<body>
<div class="shell">

  <aside class="rail">
    <div class="eyebrow">Autonomous FPL</div>
    <h1 id="railTitle">Bot vs human</h1>
    <div class="sub" id="railSub">Loading…</div>
    <div class="tabs" id="railTabs" role="tablist" aria-label="View" hidden></div>
    <div class="tally" id="tally"></div>
    <div class="eyebrow dim" style="margin-bottom:10px">Gameweeks</div>
    <nav class="gwlist" id="gwlist"></nav>
  </aside>

  <main class="main">
    <div class="mobilebar">
      <div class="top">
        <div>
          <div class="eyebrow">Autonomous FPL</div>
          <h1 id="mTitle">Bot vs human</h1>
        </div>
      </div>
      <div class="mtally" id="mtally"></div>
    </div>
    <!-- mobile: tabs and gameweek pills stay pinned while the page scrolls -->
    <div class="mnav" id="mnav">
      <div class="tabs" id="mTabs" role="tablist" aria-label="View" hidden></div>
      <div class="strip" id="strip"></div>
    </div>
    <div id="view"><div class="skel" aria-busy="true">
      <div class="eyebrow dim">Loading…</div>
      <div class="sk sk-title"></div><div class="sk sk-line"></div><div class="sk sk-block"></div>
      <div class="sk-row"><div class="sk sk-card"></div></div>
      <div class="sk-row"><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div></div>
      <div class="sk-row"><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div></div>
    </div></div>
    <div id="team" hidden></div>
    <div id="footer"></div>
  </main>

</div>

<script>

/* =========================================================================
   ANALYTICS
   Paste your IDs below. Leave a string empty to disable that provider —
   nothing loads and no requests are made.

   This is a single page: switching gameweek changes the hash, not the
   document. A stock tag would log one pageview and go quiet, so gameweek
   views, dwell time and scroll depth are sent explicitly.
   ========================================================================= */
const ANALYTICS = {
  ga4:        'G-CZ9ZSRFFFJ',   // 'G-XXXXXXXXXX'      Google Analytics 4
  clarity:    'y7gd4gcp8g',   // 'abcdefghij'        Microsoft Clarity
  cfBeacon:   '',   // '{token}'           Cloudflare Web Analytics
};

/* Squad lookup. FPL's API can't be read from the browser (no CORS header), so
   the lookup goes through the fpl-proxy Lambda — see DEPLOY.md. While this is
   empty the lookup is not shown at all and the page is otherwise unchanged. */
const PROXY_BASE = 'https://kmfpuhotvhrmudghu7cyf4tc4m0ywwcs.lambda-url.ap-south-1.on.aws';   // fpl-proxy Function URL, no trailing slash; '' hides the lookup

function loadAnalytics(){
  if(ANALYTICS.ga4){
    const s=document.createElement('script'); s.async=true;
    s.src='https://www.googletagmanager.com/gtag/js?id='+ANALYTICS.ga4;
    document.head.appendChild(s);
    window.dataLayer=window.dataLayer||[];
    window.gtag=function(){window.dataLayer.push(arguments);};
    gtag('js', new Date());
    // Manual page_view, so hash changes can send their own.
    gtag('config', ANALYTICS.ga4, {send_page_view:false});
  }
  if(ANALYTICS.clarity){
    (function(c,l,a,r,i,t,y){
      c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
      t=l.createElement(r); t.async=1;
      t.src='https://www.clarity.ms/tag/'+i;
      y=l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t,y);
    })(window, document, 'clarity', 'script', ANALYTICS.clarity);
  }
  if(ANALYTICS.cfBeacon){
    const s=document.createElement('script'); s.defer=true;
    s.src='https://static.cloudflareinsights.com/beacon.min.js';
    s.setAttribute('data-cf-beacon', JSON.stringify({token:ANALYTICS.cfBeacon}));
    document.head.appendChild(s);
  }
}

function track(name, params){
  try {
    if(window.gtag) gtag('event', name, params||{});
    if(window.clarity) clarity('event', name);
  } catch(e) { /* analytics must never break the page */ }
}

function trackPage(gw){
  try {
    if(window.gtag) gtag('event','page_view',{
      page_title: 'Gameweek '+gw,
      page_location: location.href,
      page_path: '/gw'+gw,
    });
  } catch(e) {}
}

/* --- dwell time per gameweek ------------------------------------------- */
let dwellGw = null, dwellFrom = 0, seenDepth = new Set();

function startDwell(gw){
  flushDwell();
  dwellGw = gw; dwellFrom = performance.now(); seenDepth = new Set();
}

function flushDwell(){
  if(dwellGw == null) return;
  const secs = Math.round((performance.now() - dwellFrom)/1000);
  // Sub-2s means they were passing through, not reading.
  if(secs >= 2) track('gameweek_time', {gw: dwellGw, seconds: secs});
  dwellGw = null;
}

addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden') flushDwell();
  else if(current != null && VIEW==='bot') startDwell(current);
});
addEventListener('pagehide', flushDwell);

/* --- scroll depth, reset per gameweek ----------------------------------- */
let scrollTick = false;
addEventListener('scroll', () => {
  if(scrollTick) return;
  scrollTick = true;
  requestAnimationFrame(() => {
    scrollTick = false;
    const h = document.documentElement.scrollHeight - innerHeight;
    if(h <= 0) return;
    const pct = Math.min(100, Math.round((scrollY / h) * 100));
    [25,50,75,100].forEach(mark => {
      if(pct >= mark && !seenDepth.has(mark)){
        seenDepth.add(mark);
        track('scroll_depth', {gw: VIEW==='team' ? 'team' : current, percent: mark});
      }
    });
  });
}, {passive:true});

const DATA_URL = 'data/season.json';
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n;};
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n1 = v => v==null||isNaN(v) ? '–' : (Math.round(v*10)/10).toFixed(1);
const money = c => '£'+(c/10).toFixed(1)+'m';

let SEASON=null, current=null;
// Smooth scrolling unless the visitor has asked for reduced motion.
const motion = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';

init();

async function init(){
  loadAnalytics();
  try{
    const r = await fetch(DATA_URL+'?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    SEASON = await r.json();
  }catch(e){ return empty(e.message); }

  const gws = (SEASON.gameweeks||[]).slice().sort((a,b)=>a.gw-b.gw);
  if(!gws.length) return empty('no gameweeks recorded yet');
  SEASON.gameweeks = gws;

  const names = SEASON.entries||{};
  $('#railTitle').textContent = names.bot?.name || 'The bot';
  $('#mTitle').textContent = names.bot?.name || 'The bot';
  $('#railSub').textContent = (SEASON.season||'') + ' · ' + gws.length + ' gameweeks recorded';

  renderTally();
  renderNav();
  if(HAS_TEAM){ renderTabs(); renderTeam(); }
  // Outside both views, so it stays last whichever is shown.
  $('#footer').appendChild(foot());

  track('site_load', {
    gameweeks: gws.length,
    live: SEASON.live_gw != null,
    entry: (SEASON.entries?.bot?.name || '').slice(0,40),
  });

  // #gw5 is the bot's gameweek 5; #team or #team/1234567 is the squad lookup.
  const route = () => {
    const h = location.hash || '';
    const t = h.match(/^#team(?:\/(\d{1,10}))?$/);
    if(t && HAS_TEAM) return openTeam(t[1]);
    const g = parseInt(h.replace('#gw',''),10);
    const gw = gws.some(x=>x.gw===g) ? g : (current ?? gws[gws.length-1].gw);
    if(VIEW!=='bot' || gw!==current) select(gw);
  };
  route();
  addEventListener('hashchange', route);
}

/* ---------- views ---------- */
const HAS_TEAM = !!PROXY_BASE;      // no proxy, no lookup: the page is the bot's alone
let VIEW = 'bot', TEAM_SHOWN = null;

function renderTabs(){
  ['#railTabs','#mTabs'].forEach(sel => {
    const t = $(sel);
    t.hidden = false;
    t.innerHTML = `<button class="tab" role="tab" data-tab="bot">The bot</button>
      <button class="tab" role="tab" data-tab="team">Your team</button>`;
    t.querySelectorAll('.tab').forEach(b => b.onclick = () => go(b.dataset.tab));
  });
}

// A tab click is a new history entry, so Back returns to the other view.
function go(tab){
  if(tab===VIEW) return;
  location.hash = tab==='team' ? (TEAM_SHOWN ? '#team/'+TEAM_SHOWN : '#team')
                               : '#gw'+(current ?? SEASON.gameweeks[SEASON.gameweeks.length-1].gw);
}

function showView(tab){
  VIEW = tab;
  $('#view').hidden = tab!=='bot';
  $('#team').hidden = tab!=='team';
  document.body.classList.toggle('team', tab==='team');
  document.querySelectorAll('.tab').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.tab===tab)));
}

function openTeam(id){
  const arriving = VIEW!=='team';
  showView('team');
  if(arriving){
    flushDwell(); seenDepth = new Set();
    track('tab_view', {tab:'team'});
    try { if(window.gtag) gtag('event','page_view',{page_title:'Your team',
      page_location:location.href, page_path:'/team'}); } catch(e) {}
    scrollTo({top:0,behavior:'auto'});
  }
  const input = $('#lid');
  if(id){
    if(id!==TEAM_SHOWN){ input.value = id; lookup(id); }
  } else if(TEAM_SHOWN){
    history.replaceState(null,'','#team/'+TEAM_SHOWN);   // keep the address bookmarkable
  } else {
    // Back again: show the team looked up last time straight away.
    let saved = '';
    try { saved = localStorage.getItem('fpl-lookup-id') || ''; } catch(e) {}
    if(saved){ input.value = saved; lookup(saved); }
  }
}

function empty(why){
  $('#view').innerHTML =
    `<div class="state"><h3>Nothing published yet</h3>
     <p>The bot writes <code>data/season.json</code> when it makes its next decision.</p>
     <p style="margin-top:12px;font-size:12px;color:var(--lavd)">${esc(why)}</p></div>`;
}

/* ---------- rail ---------- */
function renderTally(){
  const t = SEASON.totals||{}, e = SEASON.entries||{};
  const b = t.bot?.points ?? 0, h = t.human?.points ?? 0;
  const rows = [
    ['bot', e.bot?.name || 'Bot', b, t.bot?.overall_rank],
    ['human', e.human?.name || 'Hand-picked', h, t.human?.overall_rank],
  ];
  $('#tally').innerHTML = rows.map(([k,name,pts,rank])=>`
    <div class="tally-row ${(k==='bot'?b>=h:h>b)?'lead':''}">
      <div><div class="who">${esc(name)}</div>
      ${rank?`<div style="font-family:var(--mono);font-size:10px;color:var(--lavd);margin-top:2px">OR ${rank.toLocaleString()}</div>`:''}</div>
      <div class="pts">${pts}</div>
    </div>`).join('');
  $('#mtally').innerHTML = rows.map(([k,name,pts])=>`
    <div class="t ${(k==='bot'?b>=h:h>b)?'lead':''}">
      <div class="who">${esc(name)}</div><div class="pts">${pts}</div>
    </div>`).join('');
}

function renderNav(){
  const list=$('#gwlist'), strip=$('#strip');
  list.innerHTML=''; strip.innerHTML='';
  SEASON.gameweeks.slice().reverse().forEach(g=>{
    const bp=g.bot?.actual?.total, hp=g.human?.actual?.total;
    const b=el('button','gwbtn');
    b.dataset.gw=g.gw;
    const isLive = g.status==='live';
    b.innerHTML=`<span class="n">GW${g.gw}</span>
      ${isLive?'<span class="dot" title="in progress"></span>':''}
      <span class="r">${bp==null?'<span class="pend">pending</span>'
        :`<b>${bp}</b>${hp!=null?` <span style="color:var(--lavd)">/ ${hp}</span>`:''}`}</span>`;
    b.onclick=()=>select(g.gw);
    list.appendChild(b);
  });
  SEASON.gameweeks.forEach(g=>{
    const c=el('button','chip',`GW${g.gw}`);
    c.dataset.gw=g.gw; c.onclick=()=>select(g.gw);
    strip.appendChild(c);
  });
}

function select(gw){
  const from = current;
  const fromTeam = VIEW==='team';
  current=gw;
  if(HAS_TEAM) showView('bot');
  if(fromTeam) track('tab_view', {tab:'bot'});
  history.replaceState(null,'','#gw'+gw);
  const rec = SEASON.gameweeks.find(g=>g.gw===gw);
  trackPage(gw);
  track('gameweek_view', {gw, status: rec?.status || 'unknown',
                          from: from == null ? 'load' : 'gw'+from});
  startDwell(gw);
  document.querySelectorAll('.gwbtn,.chip').forEach(b=>
    b.setAttribute('aria-current', String(+b.dataset.gw===gw)));
  const active=document.querySelector(`.chip[aria-current="true"]`);
  if(active) active.scrollIntoView({block:'nearest',inline:'center',behavior:motion()});
  render(SEASON.gameweeks.find(g=>g.gw===gw));
  scrollTo({top:0,behavior:motion()});
}

/* ---------- gameweek view ---------- */
function render(g){
  const v=$('#view'); v.innerHTML='';
  v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter');
  const scored = g.bot?.actual?.total!=null;      // points are in, maybe provisional
  const final  = g.status==='final';               // FPL has finished checking them

  // head
  const head=el('div','head');
  head.innerHTML=`<div class="eyebrow">Picked by the bot</div>
    <h2>Gameweek ${g.gw}</h2>
    <p>${scored
      ? 'Every projection below was committed before kickoff. The number beside it is what happened.'
      : 'Every number is the bot&rsquo;s projection for this gameweek. Results appear once the matches are played.'}</p>`;
  head.appendChild(clock(g));

  const flags=el('div','flags');
  flags.append(
    pill(final ? 'Final'
         : scored ? 'Live — provisional, bonus not confirmed'
         : 'Awaiting kickoff',
         final?'ok':'live'),
    pill(g.mode==='automated'?'Submitted automatically':g.mode==='advisory'?'Advisory — applied by hand':'Mode unknown'),
    pill(money(g.bot?.value||0)+' squad'),
    pill(g.bot?.formation||''),
  );
  const topl=(g.bot?.squad||[]).filter(p=>p.pending).length;
  if(topl) flags.append(pill(topl+' still to play','live'));
  if(!g.instrumented) flags.append(pill('No projection recorded'));
  head.appendChild(flags);
  if(HAS_TEAM){
    const cta = el('a','teamcta','How does your team compare? Score it →');
    cta.href = '#team';
    cta.onclick = () => track('team_cta_click', {gw: g.gw});
    head.appendChild(cta);
  }
  v.appendChild(head);

  v.appendChild(verdict(g,scored));
  v.appendChild(guide(g,scored));
  v.appendChild(pitch(g,scored));
  v.appendChild(bench(g,scored));
  v.appendChild(transfers(g));
  if(g.news?.length) v.appendChild(news(g));
  v.appendChild(chart());
}

// Shared y-axis for the points bars: the squad's best return, floored at 10
// so a quiet week doesn't inflate every bar.
function pointScale(g){
  const v=(g.bot?.squad||[]).map(p=>Math.max(p.actual??0, p.projected_now??0));
  return Math.max(10, Math.ceil(Math.max(...v,0)));
}

/* ---------- time strip: when this last refreshed, and when it next will ---- */
let TZ_UTC = false;
try { TZ_UTC = localStorage.getItem('fpl-tz') === 'utc'; } catch(e) {}

const LOCAL_ZONE = (() => {
  try {
    const z = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
    return z.split('/').pop().replace(/_/g,' ') || 'Local';
  } catch(e) { return 'Local'; }
})();

function fmt(iso){
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  const o = {day:'numeric', month:'short', year:'numeric',
             hour:'2-digit', minute:'2-digit', hour12:false};
  if(TZ_UTC) o.timeZone = 'UTC';
  return d.toLocaleString('en-GB', o).replace(',', '') +
         ' ' + (TZ_UTC ? 'UTC' : LOCAL_ZONE);
}

function clock(g){
  const wrap = el('div','clock');
  const gen  = SEASON.generated_at;
  const every = SEASON.refresh_interval_hours || 6;
  const nd   = SEASON.next_deadline;

  const line1 = el('div','ct');
  line1.innerHTML = `<span class="k">Updated</span><b data-t="${gen||''}">${gen?fmt(gen):'—'}</b>`;
  const btn = el('button','tz', TZ_UTC ? LOCAL_ZONE : 'UTC');
  btn.setAttribute('aria-label','Switch time zone');
  btn.onclick = () => {
    TZ_UTC = !TZ_UTC;
    try { localStorage.setItem('fpl-tz', TZ_UTC ? 'utc' : 'local'); } catch(e) {}
    btn.textContent = TZ_UTC ? LOCAL_ZONE : 'UTC';
    track('timezone_toggle', {mode: TZ_UTC ? 'utc' : 'local'});
    wrap.querySelectorAll('b[data-t]').forEach(b => {
      if(b.dataset.t) b.textContent = fmt(b.dataset.t);
    });
  };
  line1.appendChild(btn);
  wrap.appendChild(line1);

  // Next refresh is the last one plus the schedule interval; if that has
  // already passed, the next run is imminent rather than overdue.
  let nextIso = null, note = '';
  if(gen){
    const t = new Date(gen).getTime() + every*3600*1000;
    nextIso = new Date(t).toISOString();
    if(t < Date.now()) note = 'due now';
  }
  const line2 = el('div','ct dim');
  if(g.status==='live'){
    line2.innerHTML = `<span class="k">Next update</span>` +
      (note ? `<b>due now</b>` : `<b data-t="${nextIso}">${fmt(nextIso)}</b>`) +
      `<span style="color:var(--lavd)">· live scores, every ${every}h</span>`;
  }else if(nd && nd.time){
    line2.innerHTML = `<span class="k">Next update</span>` +
      `<b data-t="${nd.time}">${fmt(nd.time)}</b>` +
      `<span style="color:var(--lavd)">· GW${nd.gw} deadline</span>`;
  }else if(nextIso){
    line2.innerHTML = `<span class="k">Next update</span>` +
      (note ? `<b>due now</b>` : `<b data-t="${nextIso}">${fmt(nextIso)}</b>`);
  }else{
    line2.innerHTML = `<span class="k">Next update</span><b>—</b>`;
  }
  wrap.appendChild(line2);
  return wrap;
}

const LINES=[['GK','Goalkeeper','Goalkeepers'],

function pitch(g,scored){
  const wrap=el('div','pitch');
  const scale=pointScale(g);
  const xi=(g.bot?.squad||[]).filter(p=>p.role==='xi');
  LINES.forEach(([pos,one,many])=>{
    const players=xi.filter(p=>p.pos===pos)
      .sort((a,b)=>(b.projected_now??0)-(a.projected_now??0));
    if(!players.length) return;
    const line=el('div','line line-'+pos.toLowerCase());
    line.appendChild(el('div','line-label',
      `${players.length===1?one:many} <b>${players.length}</b>`));

    players.forEach(p=>row.appendChild(card(p,g,scored,scale)));

function card(p,g,scored,scale){
  const c=el('div','pcard');
  const isCap=p.id===g.bot?.captain, isVice=p.id===g.bot?.vice;
  if(isCap) c.classList.add('capt');
  else if(isVice) c.classList.add('vice');

  // Role and substitution are independent facts — a vice-captain can also be
  // auto-subbed out, and an if/else chain silently dropped the second badge.
  const tags=[];
  if(isCap) tags.push(['badge','CAPT','Captain — points doubled']);
  else if(isVice) tags.push(['badge v','VICE','Vice-captain — takes over if the captain does not play']);
  if(scored && p.role==='bench' && p.multiplier>0)
    tags.push(['badge on', tags.length?'ON':'CAME ON','Auto-substituted on by FPL']);
  else if(scored && p.role==='xi' && p.multiplier===0)
    tags.push(['badge off', tags.length?'OUT':'SUBBED','Did not play — auto-substituted out by FPL']);
  if(tags.length){
    const row=el('div','badges');
    tags.forEach(([cls,txt,tip])=>{
      const b=el('span',cls,txt); b.title=tip; row.appendChild(b);
    });
    c.appendChild(row);
  }

  c.appendChild(el('div','nm',esc(p.name)));
  c.appendChild(el('div','tm',esc(p.team||'')));

  const s=el('div','scores');
  if(p.pending || (scored && p.actual==null)){
    // fixture hasn't been played — a zero here would be a lie
    c.classList.add('toplay');
    s.className='scores pending';
    s.appendChild(el('span','pj',n1(p.projected_now)));
    c.appendChild(s);
    c.appendChild(el('div','tolabel','To play'));
    return c;
  }
  if(scored && p.actual!=null){
    if(p.projected_now!=null) s.appendChild(el('span','pj',n1(p.projected_now)+' →'));
    const a=el('span','ac',String(p.actual));
    a.style.color = p.projected_now==null ? 'var(--white)'
      : (p.actual-p.projected_now)>=0 ? 'var(--mint)' : 'var(--rose)';
    s.appendChild(a);
  }else{
    s.className='scores pending';
    s.appendChild(el('span','pj',n1(p.projected_now)));
  }
  c.appendChild(s);

  if(scored && p.actual!=null) c.appendChild(pointsBar(p, scale));
  return c;
}

// Length = points actually scored, on a scale shared across the whole squad,
// so a 10 is visibly twice a 5. The pale tick is where the model predicted.
function pointsBar(p, scale){
  const r=el('div','pbar');
  const pts=Math.max(0,p.actual);
  const bar=el('i');
  bar.style.width=Math.min(100,(pts/scale)*100)+'%';
  const beat = p.projected_now==null || p.actual>=p.projected_now;
  bar.style.background = beat?'var(--mint)':'var(--rose)';
  r.appendChild(bar);
  if(p.projected_now!=null){
    const t=el('span','tick');
    t.style.left=Math.min(100,(Math.max(0,p.projected_now)/scale)*100)+'%';
    r.appendChild(t);
    r.title=`${p.actual} pts · model said ${n1(p.projected_now)}`;
  }else{
    r.title=`${p.actual} pts`;
  }
  return r;
}

function chart(){
  const gws=SEASON.gameweeks.filter(g=>g.bot?.actual?.total!=null);
  const s=el('div','sec');
  s.appendChild(el('div','eyebrow dim','Cumulative points'));
  if(gws.length<2){
    s.appendChild(el('div','plain','The chart appears once two gameweeks have been scored.'));
    return s;
  }
  const W=760,H=220,P={t:14,r:12,b:26,l:34};
  let bc=0,hc=0;
  const bot=[],hum=[];
  gws.forEach(g=>{
    bc+=g.bot.actual.total; bot.push([g.gw,bc]);
    if(g.human?.actual?.total!=null){ hc+=g.human.actual.total; hum.push([g.gw,hc]); }
  });
  const xs=gws.map(g=>g.gw);
  const maxY=Math.max(bc,hc,1), minX=Math.min(...xs), maxX=Math.max(...xs);
  const X=v=>P.l+((v-minX)/Math.max(1,maxX-minX))*(W-P.l-P.r);
  const Y=v=>H-P.b-(v/maxY)*(H-P.t-P.b);
  const path=pts=>pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  const ticks=[0,.5,1].map(f=>{const y=Y(maxY*f);return`
    <line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="rgba(255,255,255,.08)"/>
    <text x="${P.l-8}" y="${y+3.5}" text-anchor="end" font-family="var(--mono)" font-size="9" fill="#9A85A4">${Math.round(maxY*f)}</text>`}).join('');
  const xlab=xs.map(g=>`<text x="${X(g)}" y="${H-8}" text-anchor="middle" font-family="var(--mono)" font-size="9" fill="#9A85A4">${g}</text>`).join('');

  const w=el('div','chartwrap');
  w.innerHTML=`
    <div class="legend">
      <span><i style="background:#00FF87"></i>Bot</span>
      <span><i style="background:#C7B3CF"></i>Hand-picked</span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative points, bot versus hand-picked team">
      ${ticks}${xlab}
      ${hum.length>1?`<path d="${path(hum)}" fill="none" stroke="#C7B3CF" stroke-width="2" stroke-linejoin="round"/>`:''}
      <path d="${path(bot)}" fill="none" stroke="#00FF87" stroke-width="2.5" stroke-linejoin="round"/>
      ${bot.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3" fill="#00FF87"/>`).join('')}
    </svg>`;
  s.appendChild(w);
  return s;
}

/* ---------- score your own team ------------------------------------------
   Everything shown comes from files committed before kickoff: the frozen
   projections (data/projections/gw{n}.json) and player metadata
   (data/players.json). The browser only looks numbers up and compares them —
   it never computes a projection. */
const UPGRADE_BUDGET = 20;         // tenths of £m: the bank and selling prices aren't public
const POS_NAMES = {GK:'goalkeeper', DEF:'defender', MID:'midfielder', FWD:'forward'};
const CHIP_NAMES = {bboost:'Bench Boost', '3xc':'Triple Captain', freehit:'Free Hit',
                    wildcard:'Wildcard', manager:'Assistant Manager'};
const lookupCache = {};

class LookupError extends Error {
  constructor(reason, message){ super(message); this.reason = reason; }
}

function renderTeam(){
  const w = $('#team');
  w.innerHTML = `
    <div class="head"><div class="eyebrow">Your team</div>
      <h2>Score your own team</h2>
      <p>Not the bot&rsquo;s team: <b>yours</b>. Enter an FPL entry ID and see how the
        model rated that squad, using the projections it committed before kickoff.</p></div>
    <form class="lform" novalidate>
      <input id="lid" inputmode="numeric" autocomplete="off" maxlength="10"
        placeholder="Entry ID, e.g. 2673853" aria-label="FPL entry ID">
      <button type="submit">Score my team</button>
    </form>
    <div class="lhint">It&rsquo;s the number in the address of your FPL Points page:
      <code>…/entry/<b>1234567</b>/event/6</code></div>
    <div id="lout" aria-live="polite"></div>`;
  const input = $('#lid', w), form = $('form', w);
  try { input.value = localStorage.getItem('fpl-lookup-id') || ''; } catch(e) {}
  form.addEventListener('submit', ev => { ev.preventDefault(); lookup(input.value.trim()); });

async function lookupJSON(url, notFound){
  let r;
  try { r = await fetch(url); }
  catch(e) { throw new LookupError('network',
    'Couldn’t reach the lookup service. Check your connection, or try again in a minute.'); }
  if(r.status === 404 && notFound) throw new LookupError(notFound[0], notFound[1]);
  if(r.status === 503) throw new LookupError('fpl_updating',
    'FPL is updating its data right now. Try again in a few minutes.');
  if(!r.ok) throw new LookupError('http_'+r.status,
    'The lookup service returned an error ('+r.status+'). Try again shortly.');
  try { return await r.json(); }
  catch(e) { throw new LookupError('bad_json', 'The lookup service sent something unreadable.'); }
}

async function cachedJSON(url, notFound){
  if(!(url in lookupCache)) lookupCache[url] = lookupJSON(url, notFound)
    .catch(e => { delete lookupCache[url]; throw e; });
  return lookupCache[url];
}

async function lookup(raw){
  const out = $('#lout'), btn = $('.lform button');
  track('lookup_submitted', {});
  const fail = e => {
    const reason = e instanceof LookupError ? e.reason : 'unexpected';
    const msg = e instanceof LookupError ? e.message : 'Something went wrong. Try again.';
    out.innerHTML = '';
    out.appendChild(el('div','plain lmsg err', esc(msg)));
    track('lookup_error', {reason});
  };
  if(!/^\d{1,10}$/.test(raw) || +raw < 1)
    return fail(new LookupError('invalid_id', 'An entry ID is a whole number, like 2673853.'));
  try { localStorage.setItem('fpl-lookup-id', raw); } catch(e) {}

  btn.disabled = true;
  out.innerHTML = '';
  out.appendChild(el('div','plain lmsg loading','Looking up entry '+esc(raw)+'…'));
  try {
    const entry = await lookupJSON(`${PROXY_BASE}/entry/${raw}/`,
      ['not_found', 'There’s no FPL team with ID '+raw+'.']);
    const gw = entry.current_event;
    if(!gw) throw new LookupError('no_gameweek', 'This team hasn’t played a gameweek yet this season.');

    const [picks, proj, meta] = await Promise.all([
      lookupJSON(`${PROXY_BASE}/entry/${raw}/event/${gw}/picks/`,
        ['picks_not_public', `GW${gw} picks aren’t public yet. FPL publishes each team after the deadline.`]),
      cachedJSON(`data/projections/gw${gw}.json`,
        ['no_projections', `The model didn’t publish projections for GW${gw}, so there’s nothing honest to score this team against.`]),
      cachedJSON('data/players.json',
        ['no_players', 'The player list hasn’t been published yet. Try again later.']),
    ]);
    if(proj.partial) throw new LookupError('partial_projections',
      `GW${gw}’s projections only cover the bot’s own 15 players (they were rebuilt from the emailed poster), so other squads can’t be scored for that week.`);

    out.innerHTML = '';
    out.appendChild(lookupResult(entry, gw, picks, proj, meta.players || {}));
    TEAM_SHOWN = raw;
    if(VIEW==='team') history.replaceState(null,'','#team/'+raw);
    track('lookup_success', {gw});
  } catch(e) { fail(e); }
  finally { btn.disabled = false; }
}

function lookupResult(entry, gw, picks, proj, players){
  const scores = proj.scores || {};
  // A flagged injury carries a -50 penalty in the bot's internals; shown as 0.
  const now = id => { const s = scores[id]; return s && s[0]!=null ? Math.max(0, s[0]) : null; };
  const run = id => { const s = scores[id]; return s && s[1]!=null ? Math.max(0, s[1]) : null; };

  const squad = (picks.picks||[]).slice().sort((a,b)=>a.position-b.position).map(p => {
    const m = players[p.element] || ['#'+p.element, '', '', 0];
    return {id:p.element, name:m[0], pos:m[1], team:m[2], cost:m[3],
            role: p.position<=11 ? 'xi' : 'bench', bench_order: p.position<=11 ? null : p.position-11,
            multiplier:p.multiplier, projected_now: now(p.element), actual:null, pending:false};
  });
  const cap = (picks.picks||[]).find(p=>p.is_captain), vice = (picks.picks||[]).find(p=>p.is_vice_captain);
  const g = {gw, bot:{squad, captain: cap?.element, vice: vice?.element}};
  const xi = squad.filter(p=>p.role==='xi');
  const missing = squad.filter(p=>p.projected_now==null).length;

  const w = el('div','lres');
  const head = el('div','head');
  const frozen = proj.written_at ? fmt(proj.written_at) : null;
  head.innerHTML = `<div class="eyebrow" style="color:var(--amber)">Your team · not the bot&rsquo;s</div>
    <h2>${esc(entry.name || 'Entry '+entry.id)}</h2>
    <p>GW${gw}, scored with the projections the model committed${frozen?` on ${esc(frozen)}`:''},
      before kickoff. They&rsquo;re the model&rsquo;s view, not a forecast of your actual score.</p>`;
  const flags = el('div','flags');
  flags.append(pill('GW'+gw+' projections'));
  if(picks.active_chip) flags.append(pill((CHIP_NAMES[picks.active_chip]||picks.active_chip)+' played','live'));
  if(missing) flags.append(pill(missing+' player(s) not in the projections','live'));
  head.appendChild(flags);
  w.appendChild(head);

  // The model's total: each pick's projection times FPL's multiplier for it,
  // so the captain counts double (triple with Triple Captain) and the bench
  // counts only under Bench Boost.
  const total = squad.reduce((t,p)=>t+(p.projected_now??0)*p.multiplier, 0);
  const capRow = squad.find(p=>p.id===cap?.element);
  const best = xi.filter(p=>p.projected_now!=null).sort((a,b)=>b.projected_now-a.projected_now)[0];
  const weakest = xi.filter(p=>p.projected_now!=null).sort((a,b)=>a.projected_now-b.projected_now)[0];

  const v = el('div','verdict');
  v.appendChild(cell('bot','Model total', n1(total),
    'projection for your XI, captain '+(picks.active_chip==='3xc'?'tripled':'doubled')));
  v.appendChild(cell('human','Weakest starter', weakest ? n1(weakest.projected_now) : '–',
    weakest ? weakest.name+' · '+(weakest.team||'') : 'no projections'));
  v.appendChild(cell('proj','Captain', capRow ? n1(capRow.projected_now) : '–',
    capRow ? capRow.name : 'none set'));
  w.appendChild(v);

  const facts = el('div','lfacts');
  if(capRow && best){
    facts.appendChild(el('div','lfact', (capRow.id===best.id || capRow.projected_now>=best.projected_now)
      ? `<span class="k">Captain check</span><span class="good">The model agrees.</span>
         <b>${esc(capRow.name)}</b> had the highest projection in your XI (${n1(capRow.projected_now)}).`
      : `<span class="k">Captain check</span><span class="warn">The model would have captained
         <b>${esc(best.name)}</b></span> (${n1(best.projected_now)}) over <b>${esc(capRow.name)}</b>
         (${n1(capRow.projected_now)}).`));
  }
  facts.appendChild(el('div','lfact', upgradeText(squad, players, run)));
  w.appendChild(facts);

  w.appendChild(pitch(g, false));
  w.appendChild(bench(g, false));
  return w;
}

// The best swaps on the bot's 5-week ownership score, each within the owned
// player's current price + £2.0m, same position, at most 3 per club. Ranked
// by gain; each outgoing and each incoming player appears once, so the list
// is five different decisions rather than five replacements for one player.
const UPGRADES_SHOWN = 5;

function upgradeText(squad, players, run){
  const owned = new Set(squad.map(p=>String(p.id)));
  const clubs = {};
  squad.forEach(p=>{ clubs[p.team]=(clubs[p.team]||0)+1; });
  const swaps = [];
  squad.forEach(out=>{
    const base = run(out.id);
    if(base==null) return;
    for(const id in players){
      if(owned.has(id)) continue;
      const [name,pos,club,cost] = players[id];
      if(pos!==out.pos || cost>out.cost+UPGRADE_BUDGET) continue;
      if(club!==out.team && (clubs[club]||0)>=3) continue;
      const r = run(id);
      if(r==null || r-base<=0.05) continue;
      swaps.push({gain:r-base, now:r, was:base, out, id, name, club, cost});
    }
  });
  swaps.sort((x,y)=>y.gain-x.gain);
  const picked = [], outs = new Set(), ins = new Set();
  for(const sw of swaps){
    if(outs.has(sw.out.id) || ins.has(sw.id)) continue;
    picked.push(sw); outs.add(sw.out.id); ins.add(sw.id);
    if(picked.length===UPGRADES_SHOWN) break;
  }

  const k = `<span class="k">Best affordable upgrades · next five gameweeks</span>`;
  const note = `<div class="lhint" style="margin-top:var(--s2)">Each row is a separate option, not a
    plan: taking two together may break the budget or the three-per-club limit. Assumes up to
    ${money(UPGRADE_BUDGET)} more than the outgoing player&rsquo;s current price: your bank and
    selling prices aren&rsquo;t public. Ranked on the model&rsquo;s five-week score, which is what
    the bot uses for its own transfers.</div>`;
  if(!picked.length)
    return k+`No single swap within that budget beats your current players on the model&rsquo;s five-week view.`+note;
  return k+`<ol class="ups">`+picked.map((sw,i)=>`
    <li><span class="rk">${i+1}</span>
      <span><b>${esc(sw.out.name)}</b> → <b class="good">${esc(sw.name)}</b>
        <span class="sub">${esc(sw.club)}, ${money(sw.cost)} · ${n1(sw.now)} a week vs ${n1(sw.was)}</span></span>
      <span class="g">+${n1(sw.gain)}</span></li>`).join('')+`</ol>`+note;
}

function ago(iso){
  if(!iso) return 'Python · Linear programming · AWS Lambda';
  const t=new Date(iso);
  if(isNaN(t)) return '';
  const m=Math.round((Date.now()-t)/60000);
  if(m<2)   return 'Updated just now';
  if(m<60)  return `Updated ${m} minutes ago`;
  const hrs=Math.round(m/60);
  if(hrs<24) return `Updated ${hrs} hour${hrs>1?'s':''} ago`;
  return `Updated ${Math.round(hrs/24)} day${hrs>=48?'s':''} ago`;
}
